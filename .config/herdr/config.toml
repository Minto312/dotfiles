onboarding = false
# herdr configuration  (~/.config/herdr/config.toml)
# 変更後は `herdr server reload-config` で稼働中サーバーに反映される。
# 既定値・全キーは `herdr --default-config` を参照。

[theme]
# 組み込みテーマ: catppuccin / terminal / tokyo-night / dracula / nord /
#                gruvbox / one-dark / solarized / kanagawa / rose-pine / vesper
name = "tokyo-night"
auto_switch = false

[ui.toast]
# 背景ワークスペースのエージェント状態変化を通知する方式。
#   off      = ポップアップ無し
#   herdr    = herdr 画面内トースト
#   terminal = 外側ターミナルにデスクトップ通知を依頼
#   system   = OS の通知サービスへ直接依頼
# system にすると wezterm 経由で Windows ネイティブ通知まで届く。
# Claude Code 側の notify.sh (OSC 777) と併用するため二重に鳴ることがある点は許容。
delivery = "system"

[ui.sound]
# ヘッドレス VM + SSH 運用でオーディオデバイスが無いため無効化。
enabled = true

[session]
# サーバー再起動後、公式連携 (claude/codex) が報告する session ref を使って
# エージェントの会話セッションを復元する。zellij の永続運用と同じ思想。
resume_agents_on_restore = true

[experimental]
# フルサーバー再起動をまたいでペインの画面履歴を保持する。
# ※experimental 扱い。挙動が不安定なら false に戻す。
pane_history = true

[ui]
agent_panel_sort = "spaces"

[ui.sidebar.agents]
# agents リストの行構成。既定は [["state_icon","machine","workspace","tab"], ["agent"]]。
# tab (タブ名) は既定では非フォーカスのワークスペースで overlay0 (#565F89) になり、
# tokyo-night の背景 #1a1b26 に対してコントラスト 2.76:1 しかなく読めない。
# トークンごとに fg を指定して上書きする (fg は #RGB / #RRGGBB のみ。色名は不可)。
# #a2aad2 = panel_bg (#1a1b26) に対して 7.50:1。workspace 名の subtext0 (8.10:1) よりわずかに暗く階層を残す。
rows = [
  ["state_icon", "machine", "workspace", { token = "tab", fg = "#a2aad2" }],
  ["agent"],
]
