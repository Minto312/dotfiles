# tmux の設定。
# エージェント (Claude) の状態を、ウィンドウ (タブ) ごとに 1 件にまとめて表示する。
# 状態は、全体の設定 (~/.claude/settings.json) に置いた Claude のフックが、ペインの @agent_state に書き込む
# (フックの置き方は bin/tmux-agents の冒頭)。

# 補助コマンドの場所 (この設定ファイルの隣の bin/)
set -gF @ta '#{d:current_file}/bin/tmux-agents'
set -gF @tr '#{d:current_file}/bin/tmux-restore'

# シェルはログインシェル (今は zsh) にする。tmux の既定は「サーバーを起動したときの $SHELL」なので、
# ほかのプログラム (Claude の Bash など) から起動すると、そのプログラムのシェルになってしまう
run-shell 'sh="$(getent passwd "$(id -un)" | cut -d: -f7)"; tmux set -g default-shell "$sh" \; set-environment -g SHELL "$sh"'

# herdr のペインの中から起動しても、herdr の連携 (HERDR_*) が tmux のペインに入らないようにする
set-environment -gu HERDR_ENV
set-environment -gu HERDR_PANE_ID
set-environment -gu HERDR_TAB_ID
set-environment -gu HERDR_WORKSPACE_ID
set-environment -gu HERDR_SOCKET_PATH
set-environment -gu HERDR_BIN_PATH

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g focus-events on
set -g escape-time 10
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
# 名前を付けていないウィンドウの名前は、1 番目のペイン (普通はリーダー) の場所のディレクトリ名にする。
# #{b:pane_current_path} だけだと、フォーカスしているペインの場所になり、作業役のペインにフォーカスすると名前が変わる。
# 名前を付けたウィンドウ (new-window -n、prefix + ,) は、tmux が自動の名前を止めるので変わらない
setw -g automatic-rename-format '#{P:#{?#{==:#{pane_index},#{pane-base-index}},#{b:pane_current_path},}}'

# ---- ダブルクリックでのコピー ----
# 語の区切りを、空白・引用符・括弧・全角の句読点だけにする。既定の区切りには / : . ? = & などが入っていて、
# URL をダブルクリックしても一部しか選ばれない。コピーモードの w・b・e も、URL やパスを 1 語として動く
set -g word-separators " \"'`()<>[]{}|、。「」（）："
# ダブルクリックした語がリンク (OSC 8) なら、リンク先の URL 全体をコピーする。
# Claude Code は長い URL を改行と字下げで 2 行に分けて描くので、語の区切りでは 1 行分しか選べない。
# リンク先は 2 行のどちらの字にも付いている。リンクでなければ tmux の既定と同じ (語を選び、0.3 秒見せてからコピーする)
bind -T root DoubleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-word ; run -d 0.3 ; if -F "#{copy_cursor_hyperlink}" { run -C "set-buffer -w -- #{q:copy_cursor_hyperlink}" ; send -X cancel } { send -X copy-pipe-and-cancel } }
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run -d 0.3 \; if -F "#{copy_cursor_hyperlink}" { run -C "set-buffer -w -- #{q:copy_cursor_hyperlink}" ; send -X cancel } { send -X copy-pipe-and-cancel }

# ---- エージェントの状態の印 ----
#   ● 作業中 (working) / ! 確認待ち (blocked) / ✓ 見ていないうちに終わった (done) / ○ 待機 (idle)
set -g @agent_icon '#{?#{==:#{@agent_state},working},#[fg=yellow]●#[fg=default],#{?#{==:#{@agent_state},blocked},#[fg=red bold]!#[fg=default nobold],#{?#{==:#{@agent_state},done},#[fg=green]✓#[fg=default],#{?#{==:#{@agent_state},idle},#[fg=colour244]○#[fg=default],}}}}'

# ---- ステータス行: ウィンドウ 1 つにつき 1 件。その中にペインごとの印を並べる ----
set -g status-interval 5
set -g status-style 'bg=#1f2335,fg=#a9b1d6'
set -g status-left '#[bold] #S #[nobold]'
set -g status-left-length 20
set -g status-right "#(#{@ta} summary '#{socket_path}')%H:%M "
set -g status-right-length 40
setw -g window-status-separator ''
setw -g window-status-format ' #I:#W#{?#{P:#{@agent_state}}, #{P:#{E:@agent_icon}},} '
setw -g window-status-current-format ' #I:#W#{?#{P:#{@agent_state}}, #{P:#{E:@agent_icon}},} '
setw -g window-status-current-style 'bg=#3b4261,bold'

# ---- ペインの上の枠に、状態の印と Claude の会話の題名 (ペインの題名) を出す ----
setw -g pane-border-status top
# 作業役の名前 (@agent_name) があれば、ペインの番号のあとに出す (ペインの番号は振り直されるが、名前は変わらない)
setw -g pane-border-format ' #{E:@agent_icon} #{pane_index} #{?@agent_name,#{@agent_name} ,}#{=/70/…:pane_title} '
setw -g pane-active-border-style 'fg=cyan'

# ---- 上下に並んだペインの間の線をドラッグして、境目を動かす ----
# 枠に題名を出すと、上下のペインの間の線は下のペインの題名の行になる。tmux はこの行を上のペインの中とみなすので、
# ドラッグが境目の移動 (MouseDrag1Border) ではなく、上のペインでの文字の選択 (MouseDrag1Pane) になる。
# この行 (ペインの中身の外なので #{mouse_y} が空) で押されたら印を付け、続くドラッグで境目を動かす。
# 印が無いときは tmux の既定と同じ動きにする
bind -n MouseDown1Pane if -F "#{==:#{mouse_y},}" { set -g @drag_border 1 } { set -gu @drag_border ; select-pane -t = ; send -M }
bind -n MouseDrag1Pane if -F "#{@drag_border}" { set -gu @drag_border ; resize-pane -M } { if -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -M } }

# ---- 一覧 (prefix + a): セッション → ウィンドウ → ペインの木。ウィンドウの行に印をまとめる ----
bind a choose-tree -Zw -F '#{?pane_format,#{E:@agent_icon} #{pane_title},#{?window_format,#{P:#{E:@agent_icon}} #{window_name},#{session_windows} windows}}'

# ---- 見たら「完了 (✓)」を「待機 (○)」に戻す ----
set-hook -g session-window-changed "run-shell -b \"TA_SOCKET_PATH='#{socket_path}' '#{@ta}' seen '#{window_id}'\""
set-hook -g client-session-changed "run-shell -b \"TA_SOCKET_PATH='#{socket_path}' '#{@ta}' seen '#{window_id}'\""

# ---- develop を再起動したあとに戻す (tmux-resurrect と tmux-continuum) ----
# 5 分ごとにウィンドウ・ペイン・画面の文字を保存し、サーバーを起動したときに自動で戻す。
# Claude のペインは、今の会話を claude --resume で開き直す。仕組みとプラグインの入れ方は bin/tmux-restore の冒頭
set -g @resurrect-processes '"claude-resume->claude --resume *"'
set -gF @resurrect-hook-post-save-layout '#{@tr} save-hook'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
# 既定のサーバーのときだけ読む。試験用のサーバー (tmux -L <名前>) で読むと、同じ保存先に書き込んで既定のサーバーの記録を上書きし、
# 起動したときに既定のサーバーのウィンドウを全部戻してしまう
if -F '#{==:#{b:socket_path},default}' { run-shell '#{@tr} load' }
