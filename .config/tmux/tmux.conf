# tmux の設定。
# エージェント (Claude) の状態を、ウィンドウ (タブ) ごとに 1 件にまとめて表示する。
# 状態は `tmux-agents claude` で起動した Claude のフックが、ペインの @agent_state に書き込む。

# 補助コマンドの場所 (この設定ファイルの隣の bin/)
set -gF @ta '#{d:current_file}/bin/tmux-agents'

# herdr のペインの中から起動しても、herdr の連携 (HERDR_*) が tmux のペインに入らないようにする
set-environment -gu HERDR_ENV
set-environment -gu HERDR_PANE_ID
set-environment -gu HERDR_TAB_ID
set-environment -gu HERDR_WORKSPACE_ID
set-environment -gu HERDR_SOCKET_PATH
set-environment -gu HERDR_BIN_PATH

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g focus-events on
set -g escape-time 10
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

# ---- エージェントの状態の印 ----
#   ● 作業中 (working) / ! 確認待ち (blocked) / ✓ 見ていないうちに終わった (done) / ○ 待機 (idle)
set -g @agent_icon '#{?#{==:#{@agent_state},working},#[fg=yellow]●#[fg=default],#{?#{==:#{@agent_state},blocked},#[fg=red bold]!#[fg=default nobold],#{?#{==:#{@agent_state},done},#[fg=green]✓#[fg=default],#{?#{==:#{@agent_state},idle},#[fg=colour244]○#[fg=default],}}}}'

# ---- ステータス行: ウィンドウ 1 つにつき 1 件。その中にペインごとの印を並べる ----
set -g status-interval 5
set -g status-style 'bg=#1f2335,fg=#a9b1d6'
set -g status-left '#[bold] #S #[nobold]'
set -g status-left-length 20
set -g status-right "#(#{@ta} summary '#{socket_path}')%H:%M "
set -g status-right-length 40
setw -g window-status-separator ''
setw -g window-status-format ' #I:#W#{?#{P:#{@agent_state}}, #{P:#{E:@agent_icon}},} '
setw -g window-status-current-format ' #I:#W#{?#{P:#{@agent_state}}, #{P:#{E:@agent_icon}},} '
setw -g window-status-current-style 'bg=#3b4261,bold'

# ---- ペインの上の枠に、状態の印と Claude の会話の題名 (ペインの題名) を出す ----
setw -g pane-border-status top
setw -g pane-border-format ' #{E:@agent_icon} #{pane_index} #{=/70/…:pane_title} '
setw -g pane-active-border-style 'fg=cyan'

# ---- 一覧 (prefix + a): セッション → ウィンドウ → ペインの木。ウィンドウの行に印をまとめる ----
bind a choose-tree -Zw -F '#{?pane_format,#{E:@agent_icon} #{pane_title},#{?window_format,#{P:#{E:@agent_icon}} #{window_name},#{session_windows} windows}}'

# ---- 見たら「完了 (✓)」を「待機 (○)」に戻す ----
set-hook -g session-window-changed "run-shell -b \"TA_SOCKET_PATH='#{socket_path}' '#{@ta}' seen '#{window_id}'\""
set-hook -g client-session-changed "run-shell -b \"TA_SOCKET_PATH='#{socket_path}' '#{@ta}' seen '#{window_id}'\""
